<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кибер Кликер — Личный кабинет</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #030712;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
        }
        header { text-align: center; padding: 10px 0; width: 100%; max-width: 500px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; margin-bottom: 12px; }
        .user-info { font-size: 12px; color: #38bdf8; font-weight: 600; }
        .logout-btn { background: #334155; color: #f8fafc; border: none; font-size: 10px; padding: 4px 8px; border-radius: 6px; cursor: pointer; }
        
        #authScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 7, 18, 0.95); display: flex; align-items: center; justify-content: center; z-index: 100;
        }
        .auth-card {
            background: rgba(15, 23, 42, 0.9); border: 1px solid #1e293b; padding: 24px; border-radius: 20px; width: 90%; max-width: 350px; text-align: center;
        }
        .auth-card h2 { font-size: 20px; margin-bottom: 16px; color: #22d3ee; }
        .auth-input {
            width: 100%; padding: 12px; background: #1e293b; border: 1px solid #475569; border-radius: 10px; color: white; font-size: 14px; margin-bottom: 16px; outline: none; text-align: center;
        }
        .auth-btn {
            width: 100%; padding: 12px; background: linear-gradient(135deg, #0891b2, #4f46e5); border: none; border-radius: 10px; color: white; font-weight: 700; cursor: pointer; font-size: 14px;
        }

        main { width: 100%; max-width: 500px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
        
        .level-box {
            width: 100%; background: rgba(15, 23, 42, 0.8);
            border: 1px solid #1e293b; border-radius: 16px; padding: 12px; text-align: center;
        }
        .level-title { font-size: 13px; font-weight: 700; color: #38bdf8; margin-bottom: 6px; }
        .progress-bar-bg { width: 100%; height: 8px; background: #1e293b; border-radius: 4px; overflow: hidden; }
        .progress-bar-fill { width: 0%; height: 100%; background: linear-gradient(to right, #22d3ee, #6366f1); transition: width 0.3s; }
        .progress-text { font-size: 10px; color: #94a3b8; margin-top: 4px; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
        .stat-card { background: rgba(15, 23, 42, 0.8); border: 1px solid #1e293b; padding: 12px; border-radius: 16px; text-align: center; }
        .stat-title { font-size: 10px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-size: 22px; font-weight: 900; margin-top: 2px; }
        #scoreDisplay { color: #22d3ee; }
        #cpsDisplay { color: #818cf8; }

        .click-container { position: relative; display: flex; align-items: center; justify-content: center; padding: 6px; }
        .click-glow { position: absolute; width: 140px; height: 140px; background: rgba(34, 211, 238, 0.15); border-radius: 50%; filter: blur(20px); pointer-events: none; }
        
        #clickBtn {
            position: relative; width: 110px; height: 110px; border-radius: 50%;
            background: linear-gradient(135deg, #0891b2, #4f46e5); border: 4px solid rgba(103, 232, 249, 0.4);
            box-shadow: 0 10px 25px rgba(8, 145, 178, 0.4); display: flex; align-items: center; justify-content: center;
            font-size: 32px; color: white; cursor: pointer; user-select: none; 
            -webkit-touch-callout: none;
            touch-action: manipulation;
            transition: transform 0.1s;
        }
        #clickBtn * { pointer-events: none; }
        #clickBtn:active { transform: scale(0.92); }

        .shop { width: 100%; background: rgba(15, 23, 42, 0.8); border: 1px solid #1e293b; border-radius: 16px; padding: 12px; }
        .shop-title { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #94a3b8; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .reset-btn { background: #7f1d1d; color: #fca5a5; border: none; font-size: 9px; padding: 3px 6px; border-radius: 4px; cursor: pointer; }
        
        .upgrade-btn {
            width: 100%; display: flex; align-items: center; justify-content: space-between;
            padding: 8px 10px; margin-bottom: 6px; background: rgba(30, 41, 59, 0.6);
            border: 1px solid #334155; border-radius: 10px; cursor: pointer; color: white; text-align: left;
            touch-action: manipulation;
        }
        .upgrade-info { display: flex; align-items: center; gap: 8px; }
        .upgrade-icon { width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 13px; }
        .icon-click { background: rgba(34, 211, 238, 0.1); color: #22d3ee; }
        .icon-drone { background: rgba(129, 140, 248, 0.1); color: #818cf8; }
        .icon-reactor { background: rgba(52, 211, 153, 0.1); color: #34d399; }
        .upgrade-name { font-weight: 600; font-size: 12px; }
        .upgrade-desc { font-size: 9px; color: #94a3b8; }
        .upgrade-price { font-size: 11px; font-weight: 700; }
        .price-click { color: #22d3ee; } .price-drone { color: #818cf8; } .price-reactor { color: #34d399; }
        .upgrade-count { font-size: 9px; color: #64748b; text-align: right; }

        .logs-container {
            width: 100%; background: rgba(15, 23, 42, 0.9); border: 1px solid #1e293b; border-radius: 16px; padding: 10px 12px;
        }
        .logs-title { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #94a3b8; margin-bottom: 6px; }
        .logs-box {
            width: 100%; height: 70px; background: #020617; border: 1px solid #1e293b; border-radius: 8px;
            padding: 6px; overflow-y: auto; font-family: monospace; font-size: 10px; color: #38bdf8; display: flex; flex-direction: column; gap: 2px;
        }

        footer { text-align: center; font-size: 9px; color: #475569; padding: 6px 0; }
    </style>
</head>
<body>

    <div id="authScreen">
        <div class="auth-card">
            <h2>Авторизация</h2>
            <input type="text" id="usernameInput" class="auth-input" placeholder="Введите ваш никнейм..." maxlength="15">
            <button class="auth-btn" onclick="loginUser()">Войти в игру</button>
        </div>
    </div>

    <header>
        <div class="user-info">Игрок: <span id="currentUserLabel"></span></div>
        <button class="logout-btn" onclick="logoutUser()">Сменить игрока</button>
    </header>

    <main>
        <div class="level-box">
            <div id="levelTitle" class="level-title">Уровень 1: Новичок</div>
            <div class="progress-bar-bg">
                <div id="progressBar" class="progress-bar-fill"></div>
            </div>
            <div id="progressText" class="progress-text">0 / 200 энг. до след. уровня</div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-title">Энергия</div>
                <div id="scoreDisplay" class="stat-value">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">В секунду</div>
                <div id="cpsDisplay" class="stat-value">0</div>
            </div>
        </div>

        <div class="click-container">
            <div class="click-glow"></div>
            <button id="clickBtn">⚡</button>
        </div>

        <div class="shop">
            <div class="shop-title">
                <span>🛒 Улучшения</span>
                <button class="reset-btn" onclick="resetGame()">Сброс</button>
            </div>
            
            <button class="upgrade-btn" onclick="buyUpgrade('click')">
                <div class="upgrade-info">
                    <div class="upgrade-icon icon-click">👆</div>
                    <div>
                        <div class="upgrade-name">Усиленный клик</div>
                        <div class="upgrade-desc">Мощность: +1 за клик</div>
                    </div>
                </div>
                <div>
                    <div id="costClick" class="upgrade-price price-click">15 энг.</div>
                    <div class="upgrade-count">Куплено: <span id="countClick">0</span></div>
                </div>
            </button>

            <button class="upgrade-btn" onclick="buyUpgrade('drone')">
                <div class="upgrade-info">
                    <div class="upgrade-icon icon-drone">🤖</div>
                    <div>
                        <div class="upgrade-name">Энергетический дрон</div>
                        <div class="upgrade-desc">Доход: +1 в сек.</div>
                    </div>
                </div>
                <div>
                    <div id="costDrone" class="upgrade-price price-drone">50 энг.</div>
                    <div class="upgrade-count">Куплено: <span id="countDrone">0</span></div>
                </div>
            </button>

            <button class="upgrade-btn" onclick="buyUpgrade('reactor')">
                <div class="upgrade-info">
                    <div class="upgrade-icon icon-reactor">⚛️</div>
                    <div>
                        <div class="upgrade-name">Квантовый реактор</div>
                        <div class="upgrade-desc">Доход: +8 в сек.</div>
                    </div>
                </div>
                <div>
                    <div id="costReactor" class="upgrade-price price-reactor">300 энг.</div>
                    <div class="upgrade-count">Куплено: <span id="countReactor">0</span></div>
                </div>
            </button>
        </div>

        <div class="logs-container">
            <div class="logs-title">📋 Журнал событий (Лог)</div>
            <div id="logsBox" class="logs-box"></div>
        </div>
    </main>

    <footer>
        Кибер Кликер &copy; 2026.
    </footer>

    <script>
        let currentUsername = "";
        let score = 0;
        let totalEarned = 0;
        let level = 1;
        let clickPower = 1;
        let cps = 0;
        let logs = [];

        const upgrades = {
            click: { cost: 15, count: 0, costMult: 1.5, power: 1, name: "Усиленный клик" },
            drone: { cost: 50, count: 0, costMult: 1.4, cps: 1, name: "Энергетический дрон" },
            reactor: { cost: 300, count: 0, costMult: 1.45, cps: 8, name: "Квантовый реактор" }
        };

        const ranks = ["Новичок", "Энергетик", "Хакер", "Инженер", "Квантовый Магнат", "Повелитель Системы", "Кибер-Бог"];

        window.onload = function() {
            const savedUser = localStorage.getItem('cyber_active_user');
            if (savedUser) {
                currentUsername = savedUser;
                loadGame(currentUsername);
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('currentUserLabel').innerText = currentUsername;
            }
        };

        function loginUser() {
            const input = document.getElementById('usernameInput').value.trim();
            if (!input) {
                alert('Введите никнейм!');
                return;
            }
            currentUsername = input;
            localStorage.setItem('cyber_active_user', currentUsername);
            loadGame(currentUsername);
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('currentUserLabel').innerText = currentUsername;
            addLog(`Игрок [${currentUsername}] вошел в систему.`);
        }

        function logoutUser() {
            localStorage.removeItem('cyber_active_user');
            location.reload();
        }

        function addLog(text) {
            const time = new Date().toLocaleTimeString();
            logs.unshift(`[${time}] ${text}`);
            if (logs.length > 20) logs.pop();
            renderLogs();
            saveGame();
        }

        function renderLogs() {
            const box = document.getElementById('logsBox');
            box.innerHTML = logs.map(l => `<div>${l}</div>`).join('');
            box.scrollTop = 0;
        }

        const scoreDisplay = document.getElementById('scoreDisplay');
        const cpsDisplay = document.getElementById('cpsDisplay');
        const clickBtn = document.getElementById('clickBtn');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const levelTitle = document.getElementById('levelTitle');

        clickBtn.addEventListener('click', () => {
            score += clickPower;
            totalEarned += clickPower;
            checkLevel();
            updateUI();
            saveGame();
        });

        function buyUpgrade(type) {
            const up = upgrades[type];
            if (score >= up.cost) {
                score -= up.cost;
                up.count++;
                
                if (type === 'click') {
                    clickPower += up.power;
                } else {
                    cps += up.cps;
                }
                up.cost = Math.floor(up.cost * up.costMult);
                addLog(`Куплено: ${up.name} (ур. ${up.count})`);
                updateUI();
                saveGame();
            }
        }

        setInterval(() => {
            if (cps > 0 && currentUsername) {
                score += cps;
                totalEarned += cps;
                checkLevel();
                updateUI();
                saveGame();
            }
        }, 1000);

        function getNextLevelCost(lvl) { return lvl * 200; }

        function checkLevel() {
            let nextCost = getNextLevelCost(level);
            if (totalEarned >= nextCost) {
                level++;
                let rankName = ranks[Math.min(level - 1, ranks.length - 1)];
                addLog(`🎉 Получен уровень ${level} (${rankName})!`);
            }
        }

        function getSaveKey() {
            return 'cyber_save_user_' + currentUsername;
        }

        function saveGame() {
            if (!currentUsername) return;
            const save = {
                score, totalEarned, level, clickPower, cps, logs,
                upgrades: {
                    click: { cost: upgrades.click.cost, count: upgrades.click.count },
                    drone: { cost: upgrades.drone.cost, count: upgrades.drone.count },
                    reactor: { cost: upgrades.reactor.cost, count: upgrades.reactor.count }
                }
            };
            localStorage.setItem(getSaveKey(), JSON.stringify(save));
        }

        function loadGame(username) {
            const data = localStorage.getItem('cyber_save_user_' + username);
            if (data) {
                try {
                    const save = JSON.parse(data);
                    score = save.score || 0;
                    totalEarned = save.totalEarned || 0;
                    level = save.level || 1;
                    clickPower = save.clickPower || 1;
                    cps = save.cps || 0;
                    logs = save.logs || [`Профиль [${username}] успешно загружен.`];
                    if (save.upgrades) {
                        for (let key in save.upgrades) {
                            if (upgrades[key]) {
                                upgrades[key].cost = save.upgrades[key].cost;
                                upgrades[key].count = save.upgrades[key].count;
                            }
                        }
                    }
                } catch(e) { logs = [`Ошибка загрузки данных.`]; }
            } else {
                score = 0; totalEarned = 0; level = 1; clickPower = 1; cps = 0;
                for (let key in upgrades) {
                    upgrades[key].count = 0;
                    if(key === 'click') upgrades[key].cost = 15;
                    if(key === 'drone') upgrades[key].cost = 50;
                    if(key === 'reactor') upgrades[key].cost = 300;
                }
                logs = [`Создан новый профиль для [${username}].`];
            }
            renderLogs();
            updateUI();
        }

        function resetGame() {
            if (confirm(`Точно сбросить прогресс игрока ${currentUsername}?`)) {
                localStorage.removeItem(getSaveKey());
                location.reload();
            }
        }

        function updateUI() {
            scoreDisplay.innerText = Math.floor(score);
            cpsDisplay.innerText = cps;

            let currentLevelCost = getNextLevelCost(level);
            let prevLevelCost = getNextLevelCost(level - 1);
            let progressNow = totalEarned - prevLevelCost;
            let progressNeeded = currentLevelCost - prevLevelCost;
            let percent = Math.min(100, Math.max(0, (progressNow / progressNeeded) * 100));

            progressBar.style.width = percent + '%';
            let rankName = ranks[Math.min(level - 1, ranks.length - 1)];
            levelTitle.innerText = `Уровень ${level}: ${rankName}`;
            progressText.innerText = `${Math.floor(progressNow)} / ${progressNeeded} до след. уровня`;

            document.getElementById('costClick').innerText = upgrades.click.cost + ' энг.';
            document.getElementById('countClick').innerText = upgrades.click.count;
            document.getElementById('costDrone').innerText = upgrades.drone.cost + ' энг.';
            document.getElementById('countDrone').innerText = upgrades.drone.count;
            document.getElementById('costReactor').innerText = upgrades.reactor.cost + ' энг.';
            document.getElementById('countReactor').innerText = upgrades.reactor.count;
        }
    </script>
</body>
</html>
