<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CyberTube Mobile</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 12px;
            max-width: 600px;
            margin: 0 auto;
        }
        header { text-align: center; margin-bottom: 16px; margin-top: 6px; }
        h1 { font-size: 20px; font-weight: 800; background: linear-gradient(to right, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .input-box { display: flex; gap: 8px; margin-bottom: 12px; }
        input {
            flex: 1; padding: 10px 14px; background: #1e293b; border: 1px solid #334155; border-radius: 10px; color: white; font-size: 13px; outline: none;
        }
        input:focus { border-color: #38bdf8; }
        button {
            padding: 10px 16px; background: linear-gradient(135deg, #0ea5e9, #6366f1); border: none; border-radius: 10px; color: white; font-weight: 700; font-size: 13px; cursor: pointer; touch-action: manipulation;
        }
        button:active { transform: scale(0.96); }

        .player-card {
            background: #1e293b; border: 1px solid #334155; border-radius: 14px; overflow: hidden; margin-bottom: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            display: none;
        }
        .video-wrapper { position: relative; width: 100%; padding-bottom: 56.25%; background: #000; }
        iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        /* Плеер для фонового аудио-режима (Пипл/Инвидиус прокси) */
        .audio-player-card {
            background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 16px; margin-bottom: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            display: none; text-align: center;
        }
        .audio-player-card audio { width: 100%; margin-top: 10px; outline: none; }

        .controls-bar {
            display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: #0f172a; border-top: 1px solid #334155; font-size: 12px;
        }
        
        .toolbar {
            display: flex; gap: 8px; margin-bottom: 12px; align-items: center; justify-content: space-between; background: #1e293b; padding: 8px 12px; border-radius: 10px; border: 1px solid #334155;
            display: none;
        }
        .quality-select {
            background: #0f172a; color: #38bdf8; border: 1px solid #334155; padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; outline: none; cursor: pointer;
        }
        .bg-toggle { display: flex; align-items: center; gap: 6px; color: #38bdf8; cursor: pointer; font-weight: 600; background: #0f172a; padding: 6px 12px; border-radius: 8px; border: 1px solid #334155; }

        .section-title { font-size: 13px; font-weight: 700; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .history-list { display: flex; flex-direction: column; gap: 6px; max-height: 250px; overflow-y: auto; padding-right: 2px; }
        .history-item {
            display: flex; align-items: center; justify-content: space-between; background: #1e293b; border: 1px solid #334155; padding: 8px 12px; border-radius: 10px; cursor: pointer;
        }
        .history-item:active { background: #334155; }
        .history-info { display: flex; flex-direction: column; gap: 2px; overflow: hidden; padding-right: 8px; }
        .history-title { font-size: 12px; font-weight: 600; color: #f8fafc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .history-url { font-size: 10px; color: #64748b; }
        .del-btn { background: #7f1d1d; color: #fca5a5; border: none; padding: 6px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; }

        .error-msg { color: #f87171; font-size: 12px; margin-bottom: 10px; display: none; }
    </style>
</head>
<body>

    <header>
        <h1>CyberTube Mobile</h1>
    </header>

    <div class="input-box">
        <input type="text" id="urlInput" placeholder="Вставьте ссылку YouTube...">
        <button onclick="handlePlay()">Запуск</button>
    </div>

    <div id="errorMsg" class="error-msg">Некорректная ссылка на YouTube.</div>

    <div class="toolbar" id="toolbar">
        <div class="bg-toggle" onclick="toggleBackgroundMode()">
            🎧 <span id="bgModeText">Фон (Выкл)</span>
        </div>
        <div id="qualityWrapper">
            <span style="font-size: 11px; color: #94a3b8; margin-right: 4px;">Качество:</span>
            <select id="qualitySelect" class="quality-select" onchange="changeQuality()">
                <option value="hd1080">1080p HD</option>
                <option value="hd720">720p</option>
                <option value="large">480p</option>
            </select>
        </div>
    </div>

    <!-- Видео плеер (для обычного режима) -->
    <div id="playerCard" class="player-card">
        <div class="video-wrapper">
            <iframe id="ytPlayer" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
        </div>
        <div class="controls-bar">
            <div id="nowPlayingTitle" style="white: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;">Воспроизведение</div>
        </div>
    </div>

    <!-- Аудио плеер (для реального фонового режима без сброса при сворачивании) -->
    <div id="audioPlayerCard" class="audio-player-card">
        <div style="font-size: 13px; font-weight: 700; color: #34d399; margin-bottom: 6px;">🎧 Фоновый аудио-режим активен</div>
        <div id="audioTitle" style="font-size: 11px; color: #94a3b8; margin-bottom: 8px; word-break: break-all;"></div>
        <audio id="nativeAudio" controls autoplay></audio>
    </div>

    <div class="section-title">Библиотека и история</div>
    <div id="historyList" class="history-list"></div>

    <script>
        let historyData = JSON.parse(localStorage.getItem('cyber_history') || '[]');
        let isBackgroundActive = false;
        let currentVideoId = '';

        window.onload = renderHistory;

        function extractVideoID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function handlePlay() {
            const val = document.getElementById('urlInput').value.trim();
            const id = extractVideoID(val);
            if (!id) {
                document.getElementById('errorMsg').style.display = 'block';
                return;
            }
            document.getElementById('errorMsg').style.display = 'none';
            playVideo(id, val);
        }

        function playVideo(id, url) {
            currentVideoId = id;
            document.getElementById('toolbar').style.display = 'flex';
            
            const playerCard = document.getElementById('playerCard');
            const audioCard = document.getElementById('audioPlayerCard');
            const ytPlayer = document.getElementById('ytPlayer');
            const nativeAudio = document.getElementById('nativeAudio');
            const quality = document.getElementById('qualitySelect').value;

            if (isBackgroundActive) {
                // Если включен фон — запускаем через встроенный HTML5 аудио-поток без использования iframe
                playerCard.style.display = 'none';
                audioCard.style.display = 'block';
                document.getElementById('qualityWrapper').style.display = 'none';
                document.getElementById('audioTitle').innerText = `Видео ID: ${id}`;
                
                nativeAudio.src = `https://invidious.nerdvpn.de/latest_version?id=${id}&itag=140`;
                nativeAudio.play().catch(() => {
                    nativeAudio.src = `https://vid.puffyan.us/latest_version?id=${id}&itag=140`;
                    nativeAudio.play();
                });
            } else {
                // Обычный видеорежим
                audioCard.style.display = 'none';
                playerCard.style.display = 'block';
                document.getElementById('qualityWrapper').style.display = 'block';
                nativeAudio.pause();
                
                ytPlayer.src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&vq=${quality}&modestbranding=1&rel=0`;
                document.getElementById('nowPlayingTitle').innerText = `ID: ${id}`;
            }

            let existingIndex = historyData.findIndex(item => item.id === id);
            if (existingIndex !== -1) {
                historyData.splice(existingIndex, 1);
            }
            historyData.unshift({ id: id, url: url || `https://youtu.be/${id}` });
            if (historyData.length > 25) historyData.pop();
            
            localStorage.setItem('cyber_history', JSON.stringify(historyData));
            renderHistory();
        }

        function changeQuality() {
            if (currentVideoId && !isBackgroundActive) {
                const quality = document.getElementById('qualitySelect').value;
                const ytPlayer = document.getElementById('ytPlayer');
                ytPlayer.src = `https://www.youtube-nocookie.com/embed/${currentVideoId}?autoplay=1&vq=${quality}&modestbranding=1&rel=0`;
            }
        }

        function toggleBackgroundMode() {
            isBackgroundActive = !isBackgroundActive;
            const text = document.getElementById('bgModeText');
            if (isBackgroundActive) {
                text.innerText = "Фон (Вкл)";
                text.style.color = "#34d399";
                if (currentVideoId) {
                    playVideo(currentVideoId);
                }
            } else {
                text.innerText = "Фон (Выкл)";
                text.style.color = "#38bdf8";
                if (currentVideoId) {
                    document.getElementById('nativeAudio').pause();
                    playVideo(currentVideoId);
                }
            }
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            if (historyData.length === 0) {
                list.innerHTML = '<div style="color: #64748b; font-size: 11px; text-align: center; padding: 10px;">История пуста</div>';
                return;
            }
            list.innerHTML = historyData.map(item => `
                <div class="history-item">
                    <div class="history-info" onclick="playVideo('${item.id}', '${item.url}')">
                        <div class="history-title">YouTube Video [${item.id}]</div>
                        <div class="history-url">${item.url}</div>
                    </div>
                    <button class="del-btn" onclick="removeItem(event, '${item.id}')">Удалить</button>
                </div>
            `).join('');
        }

        function removeItem(e, id) {
            e.stopPropagation();
            historyData = historyData.filter(item => item.id !== id);
            localStorage.setItem('cyber_history', JSON.stringify(historyData));
            renderHistory();
        }
    </script>
</body>
</html>
