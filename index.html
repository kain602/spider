<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valentine Letter</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Press Start 2P', monospace;
    }

    body {
      background-color: #ffdce5;
      background-image: radial-gradient(#ffb6c1 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* --- Конверт --- */
    .envelope-box {
      text-align: center;
      cursor: pointer;
      transition: transform 0.25s ease;
    }

    .envelope-box:hover {
      transform: scale(1.05);
    }

    .envelope-svg {
      width: 170px;
      filter: drop-shadow(0 10px 15px rgba(235, 110, 130, 0.35));
    }

    .envelope-label {
      margin-top: 18px;
      color: #df405a;
      font-size: 14px;
      letter-spacing: 1px;
    }

    /* --- Пиксельное окно валентинки --- */
    .letter-window {
      position: absolute;
      width: 360px;
      background: #ffffff;
      border: 4px solid #ff4d6d;
      box-shadow: 8px 8px 0px #ff9ebb;
      padding: 18px;
      display: none;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transform: scale(0.7);
      transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .letter-window.open {
      display: flex;
      opacity: 1;
      transform: scale(1);
    }

    .window-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px dashed #ff9ebb;
      padding-bottom: 10px;
      margin-bottom: 16px;
      color: #ff4d6d;
      font-size: 13px;
    }

    .header-icons {
      display: flex;
      gap: 6px;
      font-size: 11px;
    }

    .question {
      color: #ff4d6d;
      font-size: 11px;
      line-height: 1.6;
      margin-bottom: 14px;
      text-align: center;
    }

    .cat-art {
      width: 140px;
      height: 140px;
      margin-bottom: 20px;
      image-rendering: pixelated;
    }

    /* --- Кнопки (по видео) --- */
    .buttons {
      display: flex;
      justify-content: center;
      gap: 30px;
      position: relative;
      width: 100%;
      min-height: 52px;
    }

    .no-wrapper {
      position: relative;
    }

    .btn {
      width: 120px;
      cursor: pointer;
      user-select: none;
      height: 44px;
      font-size: 11px;
      border: 3px solid #ff4d6d;
      background: #ffffff;
      color: #ff4d6d;
      box-shadow: 4px 4px 0px #ff9ebb;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #ff9ebb;
    }

    .yes-btn {
      background: #ff4d6d;
      color: #ffffff;
      box-shadow: 4px 4px 0px #ba1333;
    }

    .no-btn {
      width: 120px;
      height: 44px;
      display: inline-block;
      position: relative;
      z-index: 10;
    }

    /* --- Финальный блок согласия --- */
    .success-content {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: fadeIn 0.4s ease forwards;
    }

    .success-title {
      color: #ff4d6d;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .success-sub {
      color: #ff4d6d;
      font-size: 8px;
      line-height: 1.5;
      margin-top: 14px;
      border-top: 2px dashed #ffb6c1;
      padding-top: 10px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Экран закрытого письма -->
  <div class="envelope-box" id="envelopeBox" onclick="openLetter()">
    <svg class="envelope-svg" viewBox="0 0 100 80">
      <rect x="5" y="15" width="90" height="60" rx="6" fill="#fff5f7" stroke="#ff4d6d" stroke-width="3.5" />
      <polygon points="5,18 50,52 95,18" fill="#ffe3ea" stroke="#ff4d6d" stroke-width="3" />
      <circle cx="50" cy="45" r="7" fill="#ff4d6d" />
      <path d="M47 43 a2 2 0 0 1 3 0 a2 2 0 0 1 3 0 c0 3 -3 4.5 -3 4.5 s-3 -1.5 -3 -4.5 z" fill="#ffffff" />
    </svg>
    <div class="envelope-label">&#9825; Letter For You &#9825;</div>
  </div>

  <!-- Открытое пиксельное окно -->
  <div class="letter-window" id="letterWindow">
    <div class="window-header">
      <span>L O V E</span>
      <div class="header-icons">
        <span>&#9829;</span>
        <span>-</span>
        <span>&#9633;</span>
        <span>&times;</span>
      </div>
    </div>

    <!-- Интерактивная зона с вопросом -->
    <div id="interactiveArea" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
      <div class="question">Will you be my Valentine?</div>
      
      <!-- Котик с розой -->
      <img class="cat-art" src="https://media.tenor.com/efbquK5ttqYAAAAC/cat-rose.gif" alt="Cat with rose">

      <div class="buttons">
        <button class="btn yes-btn" onclick="acceptValentine()">YES</button>
        <div class="no-wrapper">
          <button class="btn no-btn" id="noBtn" onmouseover="dodgeNo()" onclick="dodgeNo()">NO</button>
        </div>
      </div>
    </div>

    <!-- Состояние после нажатия YES -->
    <div class="success-content" id="successArea">
      <div class="success-title">Yippeeee!</div>
      <img class="cat-art" src="https://media.tenor.com/zGm5acSjHCIAAAAC/cat-jumping-happy-cat.gif" alt="Happy Cat">
      <div class="success-sub">Valentine Date: Steak Restaurant at 7pm, dress fancy! &#10084;</div>
    </div>
  </div>

  <script>
    function openLetter() {
      document.getElementById('envelopeBox').style.display = 'none';
      const win = document.getElementById('letterWindow');
      win.style.display = 'flex';
      setTimeout(() => {
        win.classList.add('open');
      }, 20);
    }

    function dodgeNo() {
      const btn = document.getElementById('noBtn');
      // Диапазон смещения кнопки при наведении курсора
      const randomX = (Math.random() - 0.5) * 220;
      const randomY = (Math.random() - 0.5) * 160;

      btn.style.position = 'fixed';
      btn.style.left = `calc(50% + ${randomX}px)`;
      btn.style.top = `calc(60% + ${randomY}px)`;
    }

    function acceptValentine() {
      document.getElementById('interactiveArea').style.display = 'none';
      document.getElementById('successArea').style.display = 'flex';
      const noBtn = document.getElementById('noBtn');
      if (noBtn) noBtn.style.display = 'none';
    }
  </script>
</body>
</html>
