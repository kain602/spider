<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чистый Ютуб — Максимальное качество</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            touch-action: manipulation;
        }
        header { text-align: center; margin-bottom: 24px; margin-top: 10px; }
        h1 {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p { color: #94a3b8; font-size: 13px; margin-top: 4px; }
        
        .input-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
        }
        input {
            flex: 1;
            padding: 12px 16px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            color: white;
            font-size: 14px;
            outline: none;
        }
        input:focus { border-color: #38bdf8; }
        button {
            padding: 12px 20px;
            background: linear-gradient(135deg, #0ea5e9, #6366f1);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            -webkit-touch-callout: none;
            touch-action: manipulation;
        }
        button:active { transform: scale(0.96); }

        .player-container {
            width: 100%;
            max-width: 1000px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            overflow: hidden;
            display: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 */
        }
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .error-msg {
            color: #f87171;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
        footer { margin-top: auto; font-size: 10px; color: #475569; padding: 16px 0; }
    </style>
</head>
<body>

    <header>
        <h1>YouTube HD Clean Player</h1>
        <p>Без рекламы и без потери исходного качества видео</p>
    </header>

    <div class="input-container">
        <input type="text" id="urlInput" placeholder="Вставьте ссылку на YouTube...">
        <button onclick="loadVideo()">Смотреть HD</button>
    </div>

    <div id="errorMsg" class="error-msg">Неверная ссылка на YouTube. Попробуйте другую.</div>

    <div id="playerContainer" class="player-container">
        <div class="video-wrapper">
            <iframe id="ytPlayer" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
        </div>
    </div>

    <footer>
        YouTube HD Clean Player &copy; 2026
    </footer>

    <script>
        function extractVideoID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function loadVideo() {
            const inputVal = document.getElementById('urlInput').value.trim();
            const videoId = extractVideoID(inputVal);
            const playerContainer = document.getElementById('playerContainer');
            const ytPlayer = document.getElementById('ytPlayer');
            const errorMsg = document.getElementById('errorMsg');

            if (videoId) {
                errorMsg.style.display = 'none';
                // Параметрvq=hd1080 форсирует высокое разрешение плеера
                ytPlayer.src = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&vq=hd1080&modestbranding=1&rel=0`;
                playerContainer.style.display = 'block';
            } else {
                playerContainer.style.display = 'none';
                ytPlayer.src = '';
                errorMsg.style.display = 'block';
            }
        }
    </script>
</body>
</html>
