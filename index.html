<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Важный вопрос ❤️</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-pink-400 via-purple-500 to-indigo-600 min-h-screen flex flex-col items-center justify-center p-4 text-white overflow-hidden select-none">

    <div id="card" class="max-w-md w-full bg-white/10 backdrop-blur-md rounded-3xl shadow-2xl p-8 border border-white/25 text-center relative">
        
        <!-- Основной вопрос -->
        <div id="question-box">
            <h1 class="text-3xl font-extrabold mb-8 drop-shadow-md">Любишь меня? 💖</h1>
            
            <div class="flex items-center justify-center gap-6 relative min-h-[80px]">
                <button id="yes-btn" class="py-3 px-8 bg-green-500 hover:bg-green-600 text-white font-bold rounded-2xl transition transform hover:scale-110 shadow-lg text-lg z-10">
                    Да 🥰
                </button>
                <button id="no-btn" class="py-3 px-8 bg-red-500 hover:bg-red-600 text-white font-bold rounded-2xl shadow-lg text-lg transition-all duration-200">
                    Нет 🗿
                </button>
            </div>
        </div>

        <!-- Экран успеха -->
        <div id="success-box" class="hidden flex-col items-center justify-center py-6">
            <div class="text-6xl mb-4 animate-bounce">🥰</div>
            <h2 class="text-3xl font-extrabold mb-2">Я тя тоже ❤️</h2>
        </div>

        <!-- Экран с матами -->
        <div id="angry-box" class="hidden flex-col items-center justify-center py-4">
            <div class="text-6xl mb-4">🤬</div>
            <h2 class="text-2xl font-extrabold mb-6">Ты бля чепушила выбери да</h2>
            <button id="back-btn" class="py-3 px-8 bg-pink-600 hover:bg-pink-700 text-white font-bold rounded-2xl shadow-lg text-lg transition">
                Ладно, да 🤝
            </button>
        </div>

    </div>

    <script>
        const noBtn = document.getElementById('no-btn');
        const yesBtn = document.getElementById('yes-btn');
        const backBtn = document.getElementById('back-btn');
        
        const questionBox = document.getElementById('question-box');
        const successBox = document.getElementById('success-box');
        const angryBox = document.getElementById('angry-box');

        let noClickCount = 0;

        // Кнопка «Нет» убегает при наведении или попытке нажатия
        noBtn.addEventListener('mouseover', moveNoButton);
        noBtn.addEventListener('click', function(e) {
            e.preventDefault();
            noClickCount++;
            
            if (noClickCount >= 3) {
                questionBox.classList.add('hidden');
                angryBox.classList.remove('hidden');
                angryBox.classList.add('flex');
            } else {
                moveNoButton();
            }
        });

        function moveNoButton() {
            // Делаем кнопку абсолютной только после первого движения, чтобы она не ломала сетку изначально
            noBtn.style.position = 'absolute';
            const x = (Math.random() - 0.5) * 220;
            const y = (Math.random() - 0.5) * 160;
            noBtn.style.transform = `translate(${x}px, ${y}px)`;
        }

        // Если нажал «Да»
        yesBtn.addEventListener('click', function() {
            questionBox.classList.add('hidden');
            successBox.classList.remove('hidden');
            successBox.classList.add('flex');
        });

        // Возврат из гневного экрана
        backBtn.addEventListener('click', function() {
            noClickCount = 0;
            noBtn.style.position = 'static'; // возвращаем в поток
            noBtn.style.transform = `translate(0px, 0px)`;
            angryBox.classList.remove('flex');
            angryBox.classList.add('hidden');
            questionBox.classList.remove('hidden');
        });
    </script>
</body>
</html>
