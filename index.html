<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мультяшный Аватар Maker</title>
    <!-- Подключаем Tailwind CSS для красивого дизайна -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 min-h-screen flex flex-col items-center justify-center p-4 text-white">

    <div class="max-w-md w-full bg-white/10 backdrop-blur-md rounded-2xl shadow-xl p-6 border border-white/20 text-center">
        <h1 class="text-3xl font-extrabold mb-2">🎨 Мультяшный Аватар</h1>
        <p class="text-sm text-purple-200 mb-6">Загрузи фото и преврати его в яркий арт-персонаж в один клик!</p>

        <!-- Загрузка файла -->
        <label class="flex flex-col items-center justify-center border-2 border-dashed border-white/40 rounded-xl p-6 cursor-pointer hover:border-white transition bg-white/5 mb-6">
            <svg class="w-10 h-10 text-purple-200 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
            </svg>
            <span class="text-sm font-medium">Нажми, чтобы выбрать фото</span>
            <input type="file" id="upload" accept="image/*" class="hidden">
        </label>

        <!-- Область предпросмотра результата -->
        <div id="result-container" class="hidden flex flex-col items-center">
            <div class="relative w-64 h-64 rounded-2xl overflow-hidden shadow-lg border-4 border-white/50 mb-4 bg-black">
                <!-- Обработанное изображение -->
                <canvas id="canvas" class="w-full h-full object-cover"></canvas>
            </div>

            <!-- Кнопка скачивания -->
            <a id="download-btn" class="w-full py-3 px-4 bg-pink-600 hover:bg-pink-700 text-white font-bold rounded-xl transition shadow-lg cursor-pointer flex items-center justify-center gap-2">
                📥 Скачать аватарку
            </a>
        </div>
    </div>

    <footer class="mt-8 text-xs text-purple-200">
        Сделано с ❤️ для GitHub Pages
    </blockquote>

    <!-- Скрипт для обработки изображения -->
    <script>
        const upload = document.getElementById('upload');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const resultContainer = document.getElementById('result-container');
        const downloadBtn = document.getElementById('download-btn');

        upload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    // Задаем фиксированное разрешение для качественной обработки
                    const size = 500;
                    canvas.width = size;
                    canvas.height = size;

                    // Рисуем квадратную кроп-версию картинки по центру
                    const minEdge = Math.min(img.width, img.height);
                    const startX = (img.width - minEdge) / 2;
                    const startY = (img.height - minEdge) / 2;

                    // Накладываем базовые "мультяшные" CSS-фильтры прямо на контекст
                    ctx.filter = 'saturate(180%) contrast(120%) brightness(110%)';
                    ctx.drawImage(img, startX, startY, minEdge, minEdge, 0, 0, size, size);

                    // Простая стилизация под графику (постеризация/упрощение цветов)
                    applyCartoonEffect(size, size);

                    // Показываем блок с результатом
                    resultContainer.classList.remove('hidden');

                    // Настраиваем кнопку скачивания
                    downloadBtn.href = canvas.toDataURL('image/png');
                    downloadBtn.download = 'cartoon-avatar.png';
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });

        // Простая функция уменьшения палитры цветов (эффект постеризации под комикс/мультик)
        function applyCartoonEffect(width, height) {
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;
            
            // Упрощаем цвета для придания «рисованного» эффекта
            for (let i = 0; i < data.length; i += 4) {
                data[i] = Math.round(data[i] / 64) * 64;     // Красный
                data[i+1] = Math.round(data[i+1] / 64) * 64; // Зеленый
                data[i+2] = Math.round(data[i+2] / 64) * 64; // Синий
            }
            ctx.putImageData(imageData, 0, 0);
        }
    </script>
</body>
</html>
