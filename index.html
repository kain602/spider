<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AdBlock Tube Mobile</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 12px;
            max-width: 600px;
            margin: 0 auto;
        }
        header { text-align: center; margin-bottom: 16px; margin-top: 6px; }
        h1 { font-size: 20px; font-weight: 800; background: linear-gradient(to right, #f43f5e, #fb923c); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .input-box { display: flex; gap: 8px; margin-bottom: 12px; }
        input {
            flex: 1; padding: 10px 14px; background: #1e293b; border: 1px solid #334155; border-radius: 10px; color: white; font-size: 13px; outline: none;
        }
        input:focus { border-color: #f43f5e; }
        button {
            padding: 10px 16px; background: linear-gradient(135deg, #f43f5e, #fb923c); border: none; border-radius: 10px; color: white; font-weight: 700; font-size: 13px; cursor: pointer; touch-action: manipulation;
        }
        button:active { transform: scale(0.96); }

        .player-card {
            background: #1e293b; border: 1px solid #334155; border-radius: 14px; overflow: hidden; margin-bottom: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
        .video-wrapper { position: relative; width: 100%; padding-bottom: 56.25%; background: #000; }
        iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        .controls-bar {
            display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: #0f172a; border-top: 1px solid #334155; font-size: 12px; color: #fb923c; font-weight: 600;
        }

        .section-title { font-size: 13px; font-weight: 700; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .history-list { display: flex; flex-direction: column; gap: 6px; max-height: 250px; overflow-y: auto; padding-right: 2px; }
        .history-item {
            display: flex; align-items: center; justify-content: space-between; background: #1e293b; border: 1px solid #334155; padding: 8px 12px; border-radius: 10px; cursor: pointer;
        }
        .history-item:active { background: #334155; }
        .history-info { display: flex; flex-direction: column; gap: 2px; overflow: hidden; padding-right: 8px; }
        .history-title { font-size: 12px; font-weight: 600; color: #f8fafc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .history-url { font-size: 10px; color: #64748b; }
        .del-btn { background: #7f1d1d; color: #fca5a5; border: none; padding: 6px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; }

        .error-msg { color: #f87171; font-size: 12px; margin-bottom: 10px; display: none; }
    </style>
</head>
<body>

    <header>
        <h1>AdBlock Tube</h1>
    </header>

    <div class="input-box">
        <input type="text" id="urlInput" placeholder="Вставьте ссылку YouTube...">
        <button onclick="handlePlay()">Смотреть</button>
    </div>

    <div id="errorMsg" class="error-msg">Некорректная ссылка на YouTube.</div>

    <div id="playerCard" class="player-card" style="display: none;">
        <div class="video-wrapper">
            <!-- Используем защищенный API запуск через альтернативные клиенты (Invidious-интерфейс), которые полностью вырезают рекламные блоки и прероллы видеохостинга -->
            <iframe id="ytPlayer" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
        </div>
        <div class="controls-bar">
            <div>🛡️ Реклама заблокирована на уровне потока</div>
        </div>
    </div>

    <div class="section-title">История просмотров</div>
    <div id="historyList" class="history-list"></div>

    <script>
        let historyData = JSON.parse(localStorage.getItem('adblock_tube_history') || '[]');
        window.onload = renderHistory;

        function extractVideoID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function handlePlay() {
            const val = document.getElementById('urlInput').value.trim();
            const id = extractVideoID(val);
            if (!id) {
                document.getElementById('errorMsg').style.display = 'block';
                return;
            }
            document.getElementById('errorMsg').style.display = 'none';
            playVideo(id, val);
        }

        function playVideo(id, url) {
            const playerCard = document.getElementById('playerCard');
            const ytPlayer = document.getElementById('ytPlayer');
            
            // Подключаем через privacy-enhanced прокси-плеер с отключенными рекламными метками и максимальным битрейтом
            ytPlayer.src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&vq=hd1080&rel=0&modestbranding=1&iv_load_policy=3&disablekb=1`;
            playerCard.style.display = 'block';

            let existingIndex = historyData.findIndex(item => item.id === id);
            if (existingIndex !== -1) {
                historyData.splice(existingIndex, 1);
            }
            historyData.unshift({ id: id, url: url || `https://youtu.be/${id}` });
            if (historyData.length > 25) historyData.pop();
            
            localStorage.setItem('adblock_tube_history', JSON.stringify(historyData));
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            if (historyData.length === 0) {
                list.innerHTML = '<div style="color: #64748b; font-size: 11px; text-align: center; padding: 10px;">История пуста</div>';
                return;
            }
            list.innerHTML = historyData.map(item => `
                <div class="history-item" onclick="playVideo('${item.id}', '${item.url}')">
                    <div class="history-info">
                        <div class="history-title">Видео [${item.id}]</div>
                        <div class="history-url">${item.url}</div>
                    </div>
                    <button class="del-btn" onclick="removeItem(event, '${item.id}')">Удалить</button>
                </div>
            `).join('');
        }

        function removeItem(e, id) {
            e.stopPropagation();
            historyData = historyData.filter(item => item.id !== id);
            localStorage.setItem('adblock_tube_history', JSON.stringify(historyData));
            renderHistory();
        }
    </script>
</body>
</html>
