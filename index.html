<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heart Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // Математическая формула сердца из видео
    function heart(n) {
      const x = 15 * Math.pow(Math.sin(n), 3);
      const y = 12 * Math.cos(n) - 5 * Math.cos(2 * n) - 2 * Math.cos(3 * n) - Math.cos(4 * n);
      return { x, y };
    }

    let i = 0;
    let j = 0;
    const totalRings = 16;
    const pointsPerRing = 100;
    const speedPerFrame = 2; // Количество шагов за один кадр для плавной анимации

    ctx.strokeStyle = '#ff1744';
    ctx.lineWidth = 3.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    function draw() {
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      for (let s = 0; s < speedPerFrame; s++) {
        if (i >= totalRings) return;

        const scale = i; // Масштабирование контура сердца

        const p1 = heart(j / 15);
        const nextJ = j + 0.5;
        const p2 = heart(nextJ / 15);

        ctx.beginPath();
        // Инвертируем y, так как в turtle ось Y направлена вверх, а в Canvas — вниз
        ctx.moveTo(cx + p1.x * scale, cy - p1.y * scale);
        ctx.lineTo(cx + p2.x * scale, cy - p2.y * scale);
        ctx.stroke();

        j = nextJ;

        if (j >= pointsPerRing) {
          j = 0;
          i++;
        }
      }

      requestAnimationFrame(draw);
    }

    requestAnimationFrame(draw);
  </script>
</body>
</html>
