<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Любишь ли меня?</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Press Start 2P', monospace;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #ffdce5;
      background-image: radial-gradient(#ffb6c1 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Письмо / Конверт */
    .envelope-box {
      text-align: center;
      cursor: pointer;
      transition: transform 0.25s ease;
    }

    .envelope-box:hover {
      transform: scale(1.05);
    }

    .envelope-svg {
      width: 170px;
      filter: drop-shadow(0 10px 15px rgba(235, 110, 130, 0.35));
    }

    .envelope-label {
      margin-top: 18px;
      color: #df405a;
      font-size: 13px;
      letter-spacing: 1px;
    }

    /* Пиксельное окно */
    .letter-window {
      position: relative;
      width: 350px;
      background: #ffffff;
      border: 4px solid #ff4d6d;
      box-shadow: 8px 8px 0px #ff9ebb;
      padding: 24px 20px;
      display: none;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transform: scale(0.7);
      transition: opacity 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .letter-window.open {
      display: flex;
      opacity: 1;
      transform: scale(1);
    }

    .window-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px dashed #ff9ebb;
      padding-bottom: 10px;
      margin-bottom: 24px;
      color: #ff4d6d;
      font-size: 12px;
    }

    .header-icons {
      display: flex;
      gap: 6px;
      font-size: 11px;
    }

    .question {
      color: #ff4d6d;
      font-size: 14px;
      line-height: 1.8;
      margin-bottom: 32px;
      text-align: center;
    }

    /* Кнопки */
    .buttons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 25px;
      position: relative;
      width: 100%;
      min-height: 52px;
    }

    .btn {
      width: 110px;
      height: 44px;
      font-size: 12px;
      border: 3px solid #ff4d6d;
      user-select: none;
      cursor: pointer;
    }

    .yes-btn {
      background: #ff4d6d;
      color: #ffffff;
      box-shadow: 4px 4px 0px #ba1333;
      transition: transform 0.1s ease;
    }

    .yes-btn:active {
      transform: scale(0.95);
    }

    .no-btn {
      background: #ffffff;
      color: #ff4d6d;
      box-shadow: 4px 4px 0px #ff9ebb;
      transition: left 0.22s ease-out, top 0.22s ease-out;
      z-index: 100;
    }

    /* Финальный экран (появляется после «ДА») */
    .success-content {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: fadeIn 0.4s ease forwards;
    }

    .success-title {
      color: #ff4d6d;
      font-size: 15px;
      margin-bottom: 12px;
    }

    .media-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 12px 0 16px 0;
    }

    .custom-media {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 14px;
      display: block;
      box-shadow: 0 4px 12px rgba(255, 77, 109, 0.18);
    }

    .success-sub {
      color: #ff4d6d;
      font-size: 12px;
      line-height: 1.6;
      margin-top: 14px;
      border-top: 2px dashed #ffb6c1;
      padding-top: 12px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Экран 1: Закрытый конверт -->
  <div class="envelope-box" id="envelopeBox" onclick="openLetter()">
    <svg class="envelope-svg" viewBox="0 0 100 80">
      <rect x="5" y="15" width="90" height="60" rx="6" fill="#fff5f7" stroke="#ff4d6d" stroke-width="3.5" />
      <polygon points="5,18 50,52 95,18" fill="#ffe3ea" stroke="#ff4d6d" stroke-width="3" />
      <circle cx="50" cy="45" r="7" fill="#ff4d6d" />
      <path d="M47 43 a2 2 0 0 1 3 0 a2 2 0 0 1 3 0 c0 3 -3 4.5 -3 4.5 s-3 -1.5 -3 -4.5 z" fill="#ffffff" />
    </svg>
    <div class="envelope-label">&#9825; Открой меня &#9825;</div>
  </div>

  <!-- Окно валентинки -->
  <div class="letter-window" id="letterWindow">
    <div class="window-header">
      <span>L O V E</span>
      <div class="header-icons">
        <span>&#9829;</span>
        <span>-</span>
        <span>&#9633;</span>
        <span>&times;</span>
      </div>
    </div>

    <!-- Экран 2: Только вопрос и кнопки (без гифки) -->
    <div id="interactiveArea" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
      <div class="question">Любишь ли меня?</div>

      <div class="buttons">
        <button class="btn yes-btn" onclick="acceptAnswer()">ДА</button>
        <button class="btn no-btn" id="noBtn" onmouseover="dodgeNo(event)" ontouchstart="dodgeNo(event)" onclick="dodgeNo(event)">НЕТ</button>
      </div>
    </div>

    <!-- Экран 3: Твоя анимация вместо кота -->
    <div class="success-content" id="successArea">
      <div class="success-title">Урррааа! 🥰</div>
      
      <div class="media-container">
        <video id="finalVideo" class="custom-media" loop muted playsinline>
          <source src="cat.mp4.MP4" type="video/mp4">
        </video>
      </div>
      
      <div class="success-sub">Я тя тоже жаным ❤️</div>
    </div>
  </div>

  <script>
    function openLetter() {
      document.getElementById('envelopeBox').style.display = 'none';
      const win = document.getElementById('letterWindow');
      win.style.display = 'flex';
      setTimeout(() => {
        win.classList.add('open');
      }, 20);
    }

    // Кнопка НЕТ мягко убегает вокруг валентинки
    function dodgeNo(e) {
      if (e) e.preventDefault();
      const btn = document.getElementById('noBtn');
      const win = document.getElementById('letterWindow');
      const winRect = win.getBoundingClientRect();

      const margin = 60;
      const minX = Math.max(10, winRect.left - margin);
      const maxX = Math.min(window.innerWidth - btn.offsetWidth - 10, winRect.right + margin - btn.offsetWidth);
      const minY = Math.max(10, winRect.top - margin);
      const maxY = Math.min(window.innerHeight - btn.offsetHeight - 10, winRect.bottom + margin - btn.offsetHeight);

      const randomX = minX + Math.random() * (maxX - minX);
      const randomY = minY + Math.random() * (maxY - minY);

      btn.style.position = 'fixed';
      btn.style.left = `${randomX}px`;
      btn.style.top = `${randomY}px`;
    }

    // Реакция на нажатие ДА
    function acceptAnswer() {
      document.getElementById('interactiveArea').style.display = 'none';
      document.getElementById('successArea').style.display = 'flex';
      
      const video = document.getElementById('finalVideo');
      if (video) {
        video.play();
      }

      const noBtn = document.getElementById('noBtn');
      if (noBtn) noBtn.remove();
    }
  </script>
</body>
</html>
