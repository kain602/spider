<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Важный опрос 🧐</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-900 to-indigo-950 min-h-screen flex flex-col items-center justify-center p-4 text-white overflow-hidden select-none">

    <div id="card" class="max-w-md w-full bg-white/10 backdrop-blur-md rounded-3xl shadow-2xl p-8 border border-white/25 text-center relative">
        
        <!-- Главная страница (Вопрос) -->
        <div id="question-box">
            <h1 class="text-3xl font-extrabold mb-8 drop-shadow-md">Женя лох? 🤔</h1>
            
            <div class="flex items-center justify-center gap-4 relative min-h-[80px] flex-wrap">
                <button id="yes-btn" class="py-3 px-6 bg-red-600 hover:bg-red-700 text-white font-bold rounded-2xl transition transform hover:scale-105 shadow-lg text-base">
                    Да, Женя лох 😎
                </button>
                <button id="no-btn" class="py-3 px-6 bg-green-600 hover:bg-green-700 text-white font-bold rounded-2xl shadow-lg text-base transition">
                    Нет, Женя не лох 🗿
                </button>
            </div>
        </div>

        <!-- Экран успеха (если нажал Да) -->
        <div id="success-box" class="hidden flex-col items-center justify-center py-6">
            <div class="text-6xl mb-4 animate-bounce">🔥</div>
            <h2 class="text-2xl font-extrabold mb-2">Правильно, Женя каждый день сосет</h2>
        </div>

        <!-- Экран при выборе «Нет» -->
        <div id="angry-box" class="hidden flex-col items-center justify-center py-4">
            <div class="text-6xl mb-4">🤡</div>
            <h2 class="text-2xl font-extrabold mb-6">Женя чепушила</h2>
            <button id="back-btn" class="py-3 px-8 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl shadow-lg text-lg transition">
                Понял, вернуться 🤝
            </button>
        </div>

    </div>

    <script>
        const noBtn = document.getElementById('no-btn');
        const yesBtn = document.getElementById('yes-btn');
        const backBtn = document.getElementById('back-btn');
        
        const questionBox = document.getElementById('question-box');
        const successBox = document.getElementById('success-box');
        const angryBox = document.getElementById('angry-box');

        // Если выбрал «Нет, Женя не лох»
        noBtn.addEventListener('click', function() {
            questionBox.classList.add('hidden');
            angryBox.classList.remove('hidden');
            angryBox.classList.add('flex');
        });

        // Если нажал «Да, Женя лох»
        yesBtn.addEventListener('click', function() {
            questionBox.classList.add('hidden');
            successBox.classList.remove('hidden');
            successBox.classList.add('flex');
        });

        // Возврат на главную страницу после фразы «Женя чепушила»
        backBtn.addEventListener('click', function() {
            angryBox.classList.remove('flex');
            angryBox.classList.add('hidden');
            questionBox.classList.remove('hidden');
        });
    </script>
</body>
</html>
